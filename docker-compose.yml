services:
  postgres:
    image: postgres:18.3
    container_name: f1-postgres-dev
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: f1_pool
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
  ollama:
    image: alpine/ollama:0.17.4
    container_name: f1-ollama-dev
    ports:
      - "11434:11434"
  