spring:
  sql:
    init:
      mode: always
      data-locations: classpath:data-dev.sql
  jpa:
    hibernate:
      ddl-auto: create-drop  # Auto-création des tables en dev
    show-sql: false
    defer-datasource-initialization: true
    properties:
      hibernate:
        '[format_sql]': true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  security:
    oauth2:
      client:
        registration:
          google:
            client-secret: # add your client secret here
logging:
  level:
    root: INFO
    '[com.ouimet]': DEBUG
    '[org.hibernate.SQL]': DEBUG
    '[org.springframework.web]': DEBUG
      