server:
  servlet:
    session:
      cookie:
        same-site: none
        secure: true

spring:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
logging:
  level:
    root: INFO
    '[com.ouimet]': INFO

