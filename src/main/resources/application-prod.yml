spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: ${PORT:8081}

logging:
  level:
    root: INFO
    '[com.ouimet]': INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
