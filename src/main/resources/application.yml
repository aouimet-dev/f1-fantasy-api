server:
  port: ${PORT:8082}
app:
  cors:
    frontend-url: ${FRONTEND_URL:http://localhost:5175}
spring:
  application:
    name: f1-fantasy-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/f1_pool?user=admin&password=admin}
    driver-class-name: org.postgresql.Driver
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: 242615624712-he7qov4lrpehntl5p947b4gmh8ield6m.apps.googleusercontent.com
management:
  endpoints:
    web:
      exposure:
        include: '*' 
  endpoint:
    health:
      show-details: always