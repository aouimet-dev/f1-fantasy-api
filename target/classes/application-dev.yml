spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/f1_pool
    username: admin
    password: admin
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: update  # Auto-création des tables en dev
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=100,expireAfterWrite=10m

server:
  port: 8081

logging:
  level:
    root: INFO
    com.ouimet: DEBUG
    org.hibernate.SQL: DEBUG
    org.springframework.web: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: '*'  # Tous les endpoints en dev
  endpoint:
    health:
      show-details: always

f1:
  fantasy:
    username: ${F1_FANTASY_USERNAME}
    password: ${F1_FANTASY_PASSWORD}